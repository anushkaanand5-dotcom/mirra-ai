<!DOCTYPE html>
<html>

<head>
    <title>My Journal</title>
    <style>
        body {
            background-color:antiquewhite;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            padding: 10px;
        }
        h1{
            color: rgb(159, 37, 37);
        }
        textarea{
            width: 800px;
            height: 300px;
            padding: 10px;
        }
        button{
            background-color: rgb(159, 37, 37);
            color: rgb(255, 255, 255);
            border: 0ch;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
        }
        .rating {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .rating input {
            display:none;
        }
        .rating label {
            display:flex;
            flex-direction: column;
            align-items: center;
            cursor:pointer;
            transition: 0.2s;
        }
        .emoji{
            font-size: 40px;
        }
        .number{
            font-size: 16px;
            margin-top: 5px;
        }
        .rating label:hover{
            transform: scale(1.2);

        }
        .rating input:checked + label {
            transform:scale(1.3)
        }
        input[type="date"] {

            padding: 10px;
         font-size: 18px;
         border-radius: 8px;
         border: 2px solid lightgray;

        }
        .page{
            height: 100vh;
          position: relative;
        }
        .top-right {

         position: absolute;

         top: 20px;
         right: 20px;

        }
        .bottom-right {
            position: absolute;
         right: 20px;
            top: 55%;
            transform: translateY(-50%);

         display: flex;
         flex-direction: column;
         align-items: center;

        }
        .rating-heading {

            margin-bottom: 20px;

            text-align: center;

        }
        .history-btn {
            background-color: rgb(159, 37, 37);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
}
    </style>
</head>

<body>
    
    <div class="page">
    <form method="POST">

        <div class="top-right">

            <input
             type="date"
                id="journal-date"
                name="date">

        </div>

        <div>
                <p>Welcome, {{ name }}!</p>
                <h1>Daily Journal Entry</h1>

                {% if not is_editable %}
                <p>
                 This entry belongs to a previous day and cannot be edited.
                </p>
                {% endif %}

                <label>User ID:</label>
                <input type="number" name="user_id">

                <br><br>

                <p>How was your day?</p>

                <textarea
                    name="reflection"
                    rows="5"
                    cols="40"
                    {% if not is_editable %}disabled{% endif %}
                >{{ loaded_reflection }}
                </textarea>

                <br><br>
                <a href="/logout">

                    <button type="button">
                        Logout
                 </button>
                </a>
                <button type="submit" name="action" value="save" {% if not is_editable %}disabled{% endif %}>
                    Save
                </button>

                <button type="submit" name="action" value="load">
                 Load
                </button>

                <a href="/history" class="history-btn">
                    View History
                </a>
        

        </div>

        <div class="bottom-right">

            <h2 class="rating-heading">
                How was your day? Rate it out of 10.
            </h2>

            <div class="rating">

                <input type="radio" name="rating" id="m1" value="1" {% if loaded_rating == 1 %}checked{% endif %}>
                <label for="m1">
                    <span class="emoji">😭</span>
                    <span class="number">1</span>
                </label>

                <input type="radio" name="rating" id="m2" value="2" {% if loaded_rating == 2 %}checked{% endif %}>
                <label for="m2">
                    <span class="emoji">😢</span>
                    <span class="number">2</span>
                </label>

                <input type="radio" name="rating" id="m3" value="3" {% if loaded_rating == 3 %}checked{% endif %}>
                <label for="m3">
                    <span class="emoji">☹️</span>
                    <span class="number">3</span>
                </label>

                <input type="radio" name="rating" id="m4" value="4" {% if loaded_rating == 4 %}checked{% endif %}>
                <label for="m4">
                    <span class="emoji">🙁</span>
                    <span class="number">4</span>
                </label>

                <input type="radio" name="rating" id="m5" value="5" {% if loaded_rating == 5 %}checked{% endif %}>
                <label for="m5">
                    <span class="emoji">😕</span>
                    <span class="number">5</span>
                </label>

                <input type="radio" name="rating" id="m6" value="6" {% if loaded_rating == 6 %}checked{% endif %}>
                <label for="m6">
                    <span class="emoji">😐</span>
                    <span class="number">6</span>
                </label>

                <input type="radio" name="rating" id="m7" value="7" {% if loaded_rating == 7 %}checked{% endif %}>
                <label for="m7">
                 <span class="emoji">🙂</span>
                    <span class="number">7</span>
                </label>

                <input type="radio" name="rating" id="m8" value="8" {% if loaded_rating == 8 %}checked{% endif %}>
                <label for="m8">
                    <span class="emoji">😊</span>
                    <span class="number">8</span>
                </label>

                <input type="radio" name="rating" id="m9" value="9" {% if loaded_rating == 9 %}checked{% endif %}>
                <label for="m9">
                    <span class="emoji">😄</span>
                    <span class="number">9</span>
                </label>

                <input type="radio" name="rating" id="m10" value="10" {% if loaded_rating == 10 %}checked{% endif %}>
                <label for="m10">
                    <span class="emoji">🤩</span>
                    <span class="number">10</span>
                </label>

            </div>

        </div>
    </form>
    </div>
<script>

    let today = new Date().toISOString().split("T")[0];

    document.getElementById("journal-date").max = today;

</script>

</body>

</html>
